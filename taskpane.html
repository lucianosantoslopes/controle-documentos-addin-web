<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        Controle de Documentos
    </title>

    <script
        src="https://officeapis.public.onecdn.static.microsoft/1/office.js"
        type="text/javascript"
    ></script>

    <link
        rel="stylesheet"
        href="taskpane.css"
    />

</head>

<body>

    <main class="app">

        <header class="app-header">

            <h1>
                Controle de Documentos
            </h1>

            <p>
                Selecione uma ou mais MRs em PDF e escolha o tipo de importação.
            </p>

        </header>

        <section class="card">

            <h2>
                Arquivos
            </h2>

            <label
                class="file-label"
                for="fileInput"
            >
                Selecionar arquivos PDF
            </label>

            <input
                type="file"
                id="fileInput"
                accept=".pdf,application/pdf"
                multiple
            />

            <p
                id="fileCount"
                class="file-count"
            >
                Nenhum arquivo selecionado.
            </p>

            <p class="helper-text">
                É possível selecionar vários arquivos de uma só vez.
            </p>

        </section>

        <section class="card">

            <h2>
                Tipo de importação
            </h2>

            <div class="actions">

                <button
                    id="btnProjetista"
                    class="button button-primary"
                    type="button"
                >
                    Importar MR Projetista
                </button>

                <button
                    id="btnGerenciadora"
                    class="button button-secondary"
                    type="button"
                >
                    Importar MR Gerenciadora
                </button>

            </div>

        </section>

        <section
            class="result-card"
            aria-live="polite"
        >

            <h2>
                Resultado
            </h2>

            <pre id="resultado">Pronto para processar.</pre>

        </section>

    </main>

    <script src="taskpane.js"></script>

</body>

</html>
